<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bluebottle 구현</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="header">
        <div class="notice-bar">
            <a href="https://kr.bluebottlecoffee.com/collections/bestsellers" title="베스트셀러" target="_self">35,000원 이상 구매 시 무료 배송 (제주도 별도)</a>
        </div>
        <div class="header-inner">
            <div class="con header-inner-con">
                <nav class="header-nav">
                    <ul>
                        <li><a href="#" title="쇼핑" target="_self">쇼핑</a></li>
                        <li><a href="#" title="홀리데이" target="_self">홀리데이</a></li>
                        <li><a href="#" title="베스트셀러" target="_self">베스트셀러</a></li>
                        <li><a href="#" title="카페" target="_self">카페</a></li>
                        <li><a href="#" title="블로그" target="_self">블로그</a></li>
                    </ul>
                </nav>
                <h1 class="logo-box">
                    <a href="#" title="bluebottlecoffee" target="_self"><img src="./image/logo.svg" alt="로고이미지"></a>
                </h1>
                <div id="header-util" class="header-util">
                    <a href="#" title="검색" target="_self"><span class="search material-symbols-outlined">search</span></a>
                    <a href="#" title="회원정보" target="_self"><span class="person material-symbols-outlined">person</span></a>
                    <a href="#" title="장바구니" target="_self"><span class="shopping_bag material-symbols-outlined">shopping_bag</span></a>
                </div>
            </div>
        </div>
    </header>
    <main>
        <div class="main-banner">
            <div class="banner-copy">
                <h2>2026 홀리데이 원두</h2>
                <p>겨울의 풍미를 담은 세 가지 커피</p>
                <div class="banner-btns">
                    <a href="#" title="컬렉션 보기" target="_self"><button type="button">컬렉션 보기</button></a>
                    <a href="#" title="번들 혜택 받기" target="_self"><button type="button">번들 혜택 받기</button></a>
                </div>
            </div>
        </div>
    </main>
    <footer></footer>
</body>
</html>
